<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- icon.svg redrawn on a 16px grid for the toolbar: the tile edge to edge, the bubble larger and the moon
       fatter, so the crescent still reads as one when every pixel counts. -->
  <mask id="moon">
    <rect width="16" height="16" fill="#fff"/>
    <circle cx="7.5" cy="6.5" r="3.4" fill="#000"/>
    <circle cx="9.3" cy="5" r="2.8" fill="#fff"/>
  </mask>
  <rect width="16" height="16" rx="3.5" fill="#43195c"/>
  <path mask="url(#moon)" fill="#ffcc33"
        d="M3.5 2 H12.5 A1.5 1.5 0 0 1 14 3.5 V9.5 A1.5 1.5 0 0 1 12.5 11 H7.5 L4 14.5 L4.5 11 H3.5 A1.5 1.5 0 0 1 2 9.5 V3.5 A1.5 1.5 0 0 1 3.5 2 Z"/>
</svg>
